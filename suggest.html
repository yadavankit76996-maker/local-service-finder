<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Suggest a Service | Local Service Finder</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><div><p class="eyebrow">PUBLIC SUBMISSION</p><h1>Suggest a service</h1><p class="muted">Your suggestion goes to a review queue. It will not be published automatically.</p></div><a class="button secondary" href="index.html">Back to finder</a></header><main class="container narrow"><form id="suggestForm" class="panel form-grid"><label>Facility name *<input name="name" required maxlength="120"></label><label>Category *<select name="category" required><option value="">Choose one</option><option>Hospital</option><option>Clinic</option><option>Ambulance</option><option>Police station</option><option>Fire station</option><option>Emergency department</option><option>Other emergency service</option></select></label><label>Address / landmark *<textarea name="address" required rows="2" maxlength="500"></textarea></label><label>Area / locality *<input name="area" required maxlength="120"></label><label>Public contact number (optional)<input name="phone" type="tel" maxlength="40"></label><div class="two-fields"><label>Latitude (optional)<input name="latitude" type="number" step="any" min="-90" max="90"></label><label>Longitude (optional)<input name="longitude" type="number" step="any" min="-180" max="180"></label></div><label>How do you know this information? *<textarea name="source_details" required rows="3" maxlength="1000" placeholder="For example: visited the facility or read the signboard"></textarea></label><label>Additional notes (optional)<textarea name="notes" rows="2" maxlength="1000"></textarea></label><button type="submit">Submit for review</button><p class="muted small">Do not submit private personal information. Only publicly available facility details should be provided.</p><p id="suggestStatus" role="status"></p></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="suggest.js"></script></body></html>
